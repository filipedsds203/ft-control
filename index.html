<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FT · Control</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FT Control">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#34c759" id="tmeta">
<meta name="application-name" content="FT Control">
<meta name="description" content="Controle financeiro do casal">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="shortcut icon" href="/icons/favicon-32.png">
<style>
:root{
  --bg:#f2f2f7;--bg2:#fff;
  --glass:rgba(255,255,255,0.72);--glass2:rgba(255,255,255,0.52);
  --gb:rgba(255,255,255,0.9);--gb2:rgba(0,0,0,0.07);
  --sf:rgba(255,255,255,0.6);--sf2:rgba(242,242,247,0.92);
  --txt:#1c1c1e;--txt2:#3a3a3c;--txt3:#8e8e93;--txt4:#aeaeb2;
  --sep:rgba(60,60,67,0.13);
  --G:#34c759;--G2:#28a745;--Gbg:rgba(52,199,89,0.12);
  --R:#ff3b30;--Rbg:rgba(255,59,48,0.10);
  --B:#007aff;--Bbg:rgba(0,122,255,0.10);
  --O:#ff9500;--Obg:rgba(255,149,0,0.11);
  --P:#ff2d55;--Pbg:rgba(255,45,85,0.10);
  --Pr:#af52de;--Prbg:rgba(175,82,222,0.10);
  --T:#5ac8fa;--Tbg:rgba(90,200,250,0.12);
  --r:16px;--rs:12px;--rx:10px;
  --blur:blur(40px) saturate(200%);
  --sh:0 4px 28px rgba(0,0,0,0.07),0 1px 5px rgba(0,0,0,0.04);
  --sh2:0 20px 70px rgba(0,0,0,0.18),0 4px 16px rgba(0,0,0,0.08);
  --tr:all .18s cubic-bezier(.4,0,.2,1);
  --dtr:background-color 1.8s ease,color 1.8s ease,border-color 1.8s ease;
}
[data-dark]{
  --bg:#000;--bg2:#1c1c1e;
  --glass:rgba(28,28,30,0.8);--glass2:rgba(44,44,46,0.65);
  --gb:rgba(255,255,255,0.09);--gb2:rgba(255,255,255,0.06);
  --sf:rgba(44,44,46,0.65);--sf2:rgba(28,28,30,0.96);
  --txt:#f5f5f7;--txt2:#ebebf0;--txt3:#8e8e93;--txt4:#636366;
  --sep:rgba(84,84,88,0.55);
  --G:#30d158;--G2:#25a244;--Gbg:rgba(48,209,88,0.13);
  --R:#ff453a;--Rbg:rgba(255,69,58,0.13);
  --B:#0a84ff;--Bbg:rgba(10,132,255,0.13);
  --O:#ff9f0a;--Obg:rgba(255,159,10,0.13);
  --P:#ff375f;--Pbg:rgba(255,55,95,0.12);
  --Pr:#bf5af2;--Prbg:rgba(191,90,242,0.12);
  --T:#64d2ff;--Tbg:rgba(100,210,255,0.12);
  --sh:0 4px 28px rgba(0,0,0,0.4),0 1px 5px rgba(0,0,0,0.2);
  --sh2:0 24px 80px rgba(0,0,0,0.6),0 4px 20px rgba(0,0,0,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{min-height:100%;min-height:100dvh;background:var(--bg);color:var(--txt);font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;transition:var(--dtr);overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* BLOBS */
.blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:bf 20s ease-in-out infinite}
[data-dark] .blob{opacity:.11}
.b1{width:340px;height:340px;background:radial-gradient(circle,#34c759,#30b0ff);top:-100px;left:-80px}
.b2{width:260px;height:260px;background:radial-gradient(circle,#007aff,#5856d6);top:45%;right:-70px;animation-delay:-7s}
.b3{width:220px;height:220px;background:radial-gradient(circle,#ff9500,#ff2d55);bottom:-80px;left:25%;animation-delay:-14s}
@keyframes bf{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(18px,-28px) scale(1.04)}66%{transform:translate(-14px,18px) scale(.96)}}

/* LOGIN */
#ls{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s ease,transform .5s ease}
#ls.out{opacity:0;transform:scale(1.04);pointer-events:none}
.lc{width:min(360px,88vw);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:28px;padding:48px 32px 40px;box-shadow:var(--sh2);animation:pop .6s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
.l-logo{text-align:center;margin-bottom:34px}
.l-mark{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:20px;box-shadow:0 8px 24px rgba(52,199,89,.18);margin-bottom:14px;overflow:hidden}
.l-mark svg{width:40px;height:40px}
.l-mark img{width:72px;height:72px;display:block;border-radius:20px}
.hmark img{width:32px;height:32px;display:block;border-radius:9px}
.l-name{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--txt)}
.l-name em{color:var(--G);font-style:normal}
.l-sub{font-size:11px;color:var(--txt3);letter-spacing:2.5px;text-transform:uppercase;margin-top:3px}
.lf{margin-bottom:13px}
.lf label{font-size:12px;color:var(--txt3);font-weight:500;display:block;margin-bottom:5px}
.lf input{width:100%;background:var(--sf);border:1px solid var(--gb2);border-radius:var(--rs);padding:13px 15px;font-size:15px;color:var(--txt);outline:none;transition:var(--tr)}
.lf input:focus{border-color:var(--G);box-shadow:0 0 0 3px var(--Gbg)}
.lerr{display:none;font-size:12px;color:var(--R);background:var(--Rbg);border-radius:var(--rx);padding:8px 12px;text-align:center;margin-bottom:12px}
.lerr.on{display:block}
.lhelp{font-size:11px;color:var(--txt3);line-height:1.45;text-align:center;margin-top:12px}
.lbtn{width:100%;margin-top:6px;background:linear-gradient(145deg,var(--G),var(--G2));color:#fff;border:none;border-radius:var(--rs);padding:15px;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(52,199,89,.35);transition:var(--tr)}
.lbtn:active{transform:scale(.97)}
.lbtn:hover{filter:brightness(1.06)}

/* APP */
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}


/* SAFE AREA / PWA iOS */
@supports (padding: max(0px)) {
  #app{
    padding-bottom:env(safe-area-inset-bottom);
  }
  .hdr{
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-left:max(18px, env(safe-area-inset-left));
    padding-right:max(18px, env(safe-area-inset-right));
  }
  .nav{
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .main{
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
  }
  .ov{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mo{
    padding-bottom:calc(44px + env(safe-area-inset-bottom));
  }
}
input,select,textarea{font-size:16px!important}
button,input,select,textarea{touch-action:manipulation}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:.5px solid var(--sep);padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;transition:var(--dtr)}
.hmark{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;flex:0 0 32px}
.hname{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--txt)}
.hname em{color:var(--G);font-style:normal}
.hacts{display:flex;gap:7px;align-items:center}
.hbtn{height:32px;border-radius:16px;background:var(--sf);border:.5px solid var(--gb2);display:flex;align-items:center;gap:5px;padding:0 12px;font-size:13px;font-weight:500;color:var(--txt2);transition:var(--tr)}
.hbtn:hover{background:var(--glass2)}
.hia{background:var(--Gbg);border-color:rgba(52,199,89,.3);color:var(--G)}
.hia:hover{background:var(--G);color:#fff}

/* NAV */
.nav{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:.5px solid var(--sep);display:flex;transition:var(--dtr)}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;border:none;background:transparent;color:var(--txt4);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-bottom:2px solid transparent;transition:var(--tr)}
.ntab .ne{font-size:21px;line-height:1.1}
.ntab.on{color:var(--G);border-bottom-color:var(--G)}

/* MAIN */
.main{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}

/* GLASS CARD */
.gc{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--gb);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:var(--dtr)}
.glbl{font-size:11px;color:var(--txt3);font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.saldo{font-size:34px;font-weight:700;letter-spacing:-1.2px}
.srow{display:flex;margin-top:14px}
.sc{flex:1}
.sc+.sc{border-left:.5px solid var(--sep);padding-left:13px;margin-left:13px}
.sl{font-size:11px;color:var(--txt3)}
.sv{font-size:13px;font-weight:600;margin-top:2px}
.vg{color:var(--G)}.vr{color:var(--R)}.vo{color:var(--O)}.vb{color:var(--B)}.vp{color:var(--P)}.vt{color:var(--T)}
.prog{margin-top:14px}
.pt{height:3px;background:var(--sep);border-radius:99px;overflow:hidden}
.pf{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.pl{font-size:11px;color:var(--txt4);margin-top:5px}

/* ACTIONS */
.acts{display:flex;gap:9px}
.ab{flex:1;padding:13px 8px;border-radius:var(--rs);border:none;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;transition:var(--tr)}
.ab:active{transform:scale(.96)}
.abg{background:var(--G);color:#fff;box-shadow:0 4px 14px rgba(52,199,89,.28)}
.abg:hover{filter:brightness(1.07)}
.abr{background:var(--Rbg);color:var(--R);border:.5px solid rgba(255,59,48,.2)}
.abr:hover{background:var(--R);color:#fff}
.abo{background:var(--Obg);color:var(--O);border:.5px solid rgba(255,149,0,.2)}
.abo:hover{background:var(--O);color:#fff}
.abb{background:var(--Bbg);color:var(--B);border:.5px solid rgba(0,122,255,.2)}
.abb:hover{background:var(--B);color:#fff}
.abpr{background:var(--Prbg);color:var(--Pr);border:.5px solid rgba(175,82,222,.2)}
.abpr:hover{background:var(--Pr);color:#fff}
.abgr{background:var(--sf2);color:var(--txt2);border:.5px solid var(--gb2)}
.abgr:hover{background:var(--sep)}

/* PILLS */
.pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:20px;border:.5px solid var(--sep);background:transparent;font-size:12px;color:var(--txt3);transition:var(--tr)}
.pill:hover{border-color:var(--G);color:var(--G)}
.pill.on{background:var(--G);color:#fff;border-color:var(--G)}

/* ITEM */
.ilist{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.item:last-child{border-bottom:none}
.ico{width:38px;height:38px;border-radius:var(--rx);background:var(--sf2);border:.5px solid var(--gb2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.ii{flex:1;min-width:0}
.id{font-size:14px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im{font-size:11px;color:var(--txt4);margin-top:1px}
.iv{font-size:14px;font-weight:600;white-space:nowrap}
.iact{display:flex;gap:4px;margin-left:5px}
.iab{width:28px;height:28px;border-radius:8px;border:none;background:var(--sf2);font-size:13px;display:flex;align-items:center;justify-content:center;transition:var(--tr);color:var(--txt3)}
.iab:hover{background:var(--sep)}
.iab.dl:hover{background:var(--Rbg);color:var(--R)}
.iab.ed:hover{background:var(--Bbg);color:var(--B)}
.bdg{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;margin-left:4px;vertical-align:middle;font-weight:500}
.bpg{background:var(--Gbg);color:var(--G)}
.bpd{background:var(--Obg);color:var(--O)}
.bele{background:var(--Gbg);color:var(--G)}
.bela{background:var(--Pbg);color:var(--P)}
.binf{background:var(--Bbg);color:var(--B)}
.bgr{background:var(--sf2);color:var(--txt3)}

/* FUTURAS */
.futa{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mpb{font-size:11px;padding:3px 10px;border-radius:20px;border:.5px solid;cursor:pointer;font-family:inherit;font-weight:500;background:transparent;transition:var(--tr)}
.mpb.pg{border-color:var(--G);color:var(--G)}
.mpb.pg:hover{background:var(--G);color:#fff}
.mpb.ud{border-color:var(--O);color:var(--O)}
.mpb.ud:hover{background:var(--O);color:#fff}

/* DIV ROW */
.drow{display:flex;gap:7px;margin-top:7px;padding-left:49px}
.dbox{flex:1;background:var(--sf2);border-radius:var(--rx);padding:7px 10px;border:.5px solid var(--gb2)}
.dl{font-size:10px;color:var(--txt3)}
.dv{font-size:13px;font-weight:600;margin-top:1px}

/* PIG */
.pigrow{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.pigrow:last-child{border-bottom:none}
.pigico{width:40px;height:40px;border-radius:var(--rx);background:var(--sf2);border:.5px solid var(--gb2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:pointer;transition:var(--tr)}
.pigico:hover{transform:scale(1.1) rotate(-6deg)}
.pigi{flex:1}
.pign{font-size:14px;font-weight:500}
.pigo{font-size:11px;color:var(--txt3);margin-top:2px}
.pigb{font-size:10px;color:var(--txt4);margin-top:1px}
.pigr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pigv{font-size:16px;font-weight:700;color:var(--B)}
.piglb{display:flex;gap:5px}
.pbt{font-size:11px;padding:4px 10px;border-radius:20px;border:.5px solid;cursor:pointer;font-family:inherit;font-weight:500;background:transparent;transition:var(--tr)}
.pbg{border-color:var(--G);color:var(--G)}
.pbg:hover{background:var(--G);color:#fff}
.pbr{border-color:var(--R);color:var(--R)}
.pbr:hover{background:var(--R);color:#fff}

/* ══════════════════════════════════
   MÊS VIEW
══════════════════════════════════ */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--sf2);font-size:18px;color:var(--txt2);transition:var(--tr);flex-shrink:0}
.mnbtn:hover{background:var(--sep);transform:scale(1.05)}
.month-label{text-align:center;flex:1}
.month-name{font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--txt)}
.month-tag{font-size:11px;font-weight:500;padding:2px 10px;border-radius:20px;display:inline-block;margin-top:3px}
.mt-curr{background:var(--Gbg);color:var(--G)}
.mt-next{background:var(--Bbg);color:var(--B)}
.mt-past{background:var(--sf2);color:var(--txt3)}

/* HEALTH RING */
.health-wrap{display:flex;align-items:center;gap:18px;padding:4px 0}
.ring-svg{flex-shrink:0}
.ring-info{flex:1}
.ring-val{font-size:28px;font-weight:700;letter-spacing:-.8px}
.ring-lbl{font-size:12px;color:var(--txt3);margin-top:2px}
.ring-sub{font-size:11px;color:var(--txt4);margin-top:5px;line-height:1.4}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-left{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;border:2px solid var(--bg2)}
.tl-line{flex:1;width:1.5px;background:var(--sep);margin-top:4px}
.tl-item:last-child .tl-line{display:none}
.tl-body{flex:1;padding-bottom:2px}
.tl-date{font-size:10px;color:var(--txt4);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.tl-card{background:var(--sf2);border-radius:var(--rs);border:.5px solid var(--gb2);padding:10px 13px;display:flex;align-items:center;gap:10px}
.tl-emoji{font-size:18px;flex-shrink:0}
.tl-info{flex:1;min-width:0}
.tl-name{font-size:13px;font-weight:500}
.tl-meta{font-size:11px;color:var(--txt4);margin-top:1px}
.tl-val{font-size:13px;font-weight:600;white-space:nowrap}
.tl-btns{display:flex;gap:4px;flex-direction:column;align-items:flex-end}

/* STAT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sbox{background:var(--sf2);border-radius:var(--rs);padding:13px 14px;border:.5px solid var(--gb2)}
.sbox-l{font-size:11px;color:var(--txt3);font-weight:500}
.sbox-v{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-top:4px}

/* FORECAST CARD */
.fc{border-radius:var(--r);padding:18px;border:.5px solid;transition:var(--dtr)}
.fc-title{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.fc-val{font-size:26px;font-weight:700;letter-spacing:-.8px;margin-bottom:4px}
.fc-note{font-size:11px;opacity:.8;line-height:1.4}

/* NEXT MONTH: confirm panel */
.confirm-list{display:flex;flex-direction:column;gap:8px}
.confirm-row{background:var(--sf2);border-radius:var(--rs);border:.5px solid var(--gb2);padding:11px 13px;display:flex;align-items:center;gap:10px}
.confirm-info{flex:1}
.confirm-name{font-size:13px;font-weight:500}
.confirm-meta{font-size:11px;color:var(--txt4);margin-top:1px}
.confirm-val{font-size:13px;font-weight:600;color:var(--R);margin-right:8px;white-space:nowrap}
.confirm-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sep);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:var(--tr);font-size:13px}
.confirm-chk.yes{background:var(--G);border-color:var(--G);color:#fff}
.confirm-chk.no{background:var(--Rbg);border-color:var(--R);color:var(--R)}
.confirm-footer{background:var(--Gbg);border:.5px solid rgba(52,199,89,.25);border-radius:var(--rs);padding:10px 14px;font-size:12px;color:var(--G);font-weight:500}

/* SECTION HEAD */
.sh{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.sh-l{flex:1;height:.5px;background:var(--sep)}
.sh-t{font-size:11px;color:var(--txt3);font-weight:600;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;z-index:200;animation:fdi .2s ease}
@keyframes fdi{from{opacity:0}to{opacity:1}}

<script>

// Bloqueio de zoom/pinça para uso como web app instalado.
(function bloquearZoomMobile(){
  let lastTouchEnd = 0;
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches.length > 1){ e.preventDefault(); }
  }, {passive:false});
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouchEnd <= 300){ e.preventDefault(); }
    lastTouchEnd = now;
  }, {passive:false});
})();

/* ─── UTILS ─── */
const fmt=v=>'R$\u00a0'+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtSaldo=v=>(v<0?'−':'')+'R$\u00a0'+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const MNAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let _id=200;const uid=()=>++_id;
const now=new Date();
const TODAY_Y=now.getFullYear(),TODAY_M=now.getMonth();
const todayISO=()=>new Date().toISOString().slice(0,10);
const isoDay=(day)=>`${TODAY_Y}-${String(TODAY_M+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
const STORAGE={data:'ftcontrol:data:v4',token:'ftcontrol:token:v1',user:'ftcontrol:user:v1',settings:'ftcontrol:settings:v1'};
const API_BASE='https://ft-control-api.onrender.com';

let cloudSaveTimer=null;
let isLoadingRemote=false;

function money(n){return Number.isFinite(Number(n))?Number(n):0;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function getToken(){return localStorage.getItem(STORAGE.token)||'';}
function setToken(token){token?localStorage.setItem(STORAGE.token,token):localStorage.removeItem(STORAGE.token);}
function setUser(user){user?localStorage.setItem(STORAGE.user,JSON.stringify(user)):localStorage.removeItem(STORAGE.user);}
function getUser(){try{return JSON.parse(localStorage.getItem(STORAGE.user)||'null');}catch{return null;}}
async function apiFetch(path,opts={}){
  const token=getToken();
  const headers={...(opts.headers||{})};
  if(opts.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  if(token)headers.Authorization=`Bearer ${token}`;
  const res=await fetch(`${API_BASE}${path}`,{...opts,headers});
  const text=await res.text();
  let data=null;
  try{data=text?JSON.parse(text):null;}catch{data={raw:text};}
  if(!res.ok){
    const msg=data?.error||data?.message||`Erro HTTP ${res.status}`;
    const err=new Error(msg);
    err.status=res.status;err.data=data;
    throw err;
  }
  return data;
}
function debounceCloudSave(){
  if(isLoadingRemote||!getToken())return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(saveCloudNow,800);
}
async function saveCloudNow(){
  if(!getToken())return;
  try{await apiFetch('/state',{method:'PUT',body:JSON.stringify({state:DB})});}
  catch(e){console.warn('Não foi possível salvar na nuvem agora. Mantive o backup local.',e);}
}
function saveDB(){
  try{localStorage.setItem(STORAGE.data,JSON.stringify(DB));}catch(e){console.warn('Não foi possível salvar localmente',e);}
  debounceCloudSave();
}
function saveSettings(){try{localStorage.setItem(STORAGE.settings,JSON.stringify({dark}));}catch(e){}}
function createDefaultDB(){
  return {
    ele:{
      saldo:0,
      entradas:[],
      saidas:[],
      futuras:[]
    },
    ela:{
      saldo:0,
      entradas:[],
      saidas:[],
      futuras:[]
    },
    casal:{
      recorrentes:[],
      esporadicas:[]
    },
    eco:[],
    instancias:{},
    movimentos:[],
    emprestimos:[]
  };
}
function normalizeDB(db){
  const def=createDefaultDB();
  db=db&&typeof db==='object'?db:{};
  db.ele={...def.ele,...(db.ele||{})};
  db.ela={...def.ela,...(db.ela||{})};
  db.casal={...def.casal,...(db.casal||{})};
  db.eco=Array.isArray(db.eco)?db.eco:def.eco;
  db.instancias=db.instancias&&typeof db.instancias==='object'?db.instancias:{};
  db.movimentos=Array.isArray(db.movimentos)?db.movimentos:[];
  db.emprestimos=Array.isArray(db.emprestimos)?db.emprestimos:[];
  ['ele','ela'].forEach(a=>{
    db[a].entradas=Array.isArray(db[a].entradas)?db[a].entradas:[];
    db[a].saidas=Array.isArray(db[a].saidas)?db[a].saidas:[];
    db[a].futuras=Array.isArray(db[a].futuras)?db[a].futuras:[];
    db[a].saldo=money(db[a].saldo);
  });
  db.casal.recorrentes=Array.isArray(db.casal.recorrentes)?db.casal.recorrentes:[];
  db.casal.esporadicas=Array.isArray(db.casal.esporadicas)?db.casal.esporadicas:[];
  return db;
}
function loadDB(){
  try{const raw=localStorage.getItem(STORAGE.data);return normalizeDB(raw?JSON.parse(raw):createDefaultDB());}
  catch(e){console.warn('Dados locais corrompidos. Usando base inicial.',e);return createDefaultDB();}
}
async function syncNow(){
  const btn=document.getElementById('sync-btn');
  if(!btn||!getToken())return;
  // Estado visual: girando
  btn.className='hbtn hbtn-sync syncing';
  try{
    await loadRemoteState();
    render();
    // Feedback de sucesso
    btn.className='hbtn hbtn-sync ok';
    setTimeout(()=>btn.className='hbtn hbtn-sync',1800);
  }catch(e){
    // Feedback de erro
    btn.className='hbtn hbtn-sync err';
    setTimeout(()=>btn.className='hbtn hbtn-sync',2000);
  }
}

async function loadRemoteState(){
  isLoadingRemote=true;
  try{
    const data=await apiFetch('/state');
    DB=normalizeDB(data?.state||createDefaultDB());
    syncIds();
    ensureCurrentMonthInstances();
    try{localStorage.setItem(STORAGE.data,JSON.stringify(DB));}catch(e){}
    return DB;
  }finally{
    isLoadingRemote=false;
  }
}
function syncIds(){
  const ids=[];
  ['ele','ela'].forEach(a=>['entradas','saidas','futuras'].forEach(l=>DB[a][l].forEach(i=>ids.push(Number(i.id)||0))));
  DB.casal.recorrentes.forEach(i=>ids.push(Number(i.id)||0));
  DB.casal.esporadicas.forEach(i=>ids.push(Number(i.id)||0));
  DB.eco.forEach(i=>ids.push(Number(i.id)||0));
  if(Array.isArray(DB.emprestimos))DB.emprestimos.forEach(i=>ids.push(Number(i.id)||0));
  _id=Math.max(200,...ids);
}
function ensureCurrentMonthInstances(){
  const todayDay=new Date().getDate();
  const nextM=TODAY_M===11?0:TODAY_M+1;
  const nextY=TODAY_M===11?TODAY_Y+1:TODAY_Y;
  for(const r of DB.casal.recorrentes){
    // Mês atual: só confirmar se o dia de vencimento ainda não passou
    const ke=`${TODAY_Y}_${TODAY_M}_${r.id}_ele`;
    const kl=`${TODAY_Y}_${TODAY_M}_${r.id}_ela`;
    if(!DB.instancias[ke])DB.instancias[ke]={confirmed:r.day>=todayDay,pago:false};
    if(!DB.instancias[kl])DB.instancias[kl]={confirmed:r.day>=todayDay,pago:false};
    // Próximo mês: confirmar automaticamente (pode cancelar manualmente)
    const kne=`${nextY}_${nextM}_${r.id}_ele`;
    const knl=`${nextY}_${nextM}_${r.id}_ela`;
    if(!DB.instancias[kne])DB.instancias[kne]={confirmed:true,pago:false};
    if(!DB.instancias[knl])DB.instancias[knl]={confirmed:true,pago:false};
  }
}
let DB=loadDB();
syncIds();
ensureCurrentMonthInstances();
function getInst(y,m,recId,aba){
  const k=`${y}_${m}_${recId}_${aba}`;
  if(!DB.instancias[k]) DB.instancias[k]={confirmed:false,pago:false};
  return DB.instancias[k];
}
function isCurrMonth(y,m){return y===TODAY_Y&&m===TODAY_M;}
function isNextMonth(y,m){
  if(m===TODAY_M+1&&y===TODAY_Y)return true;
  if(TODAY_M===11&&m===0&&y===TODAY_Y+1)return true;
  return false;
}


/* ─── AUTH CLOUD ─── */
function setLoginLoading(on){
  const b=document.getElementById('lbtn');
  if(b){b.disabled=!!on;b.textContent=on?'Entrando...':'Entrar';b.style.opacity=on?'.75':'1';}
}
function showLoginError(msg){
  const err=document.getElementById('lerr');
  err.textContent=msg||'Não foi possível entrar';
  err.classList.add('on');
}
function hideLogin(){
  document.getElementById('lerr').classList.remove('on');

async function login(){
  const email=document.getElementById('lu').value.trim().toLowerCase();
  const pass=document.getElementById('lp').value;
  const setupCode=document.getElementById('lc')?.value?.trim()||'';

  if(!email||!email.includes('@')){showLoginError('Informe um e-mail válido');return;}
  if(pass.length<6){showLoginError('A senha precisa ter pelo menos 6 caracteres');return;}

  setLoginLoading(true);
  try{
    let data;
    try{
      data=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});
    }catch(err){
      if(err.status===401&&setupCode){
        const name=email.split('@')[0]||'Usuário';
        data=await apiFetch('/auth/register',{method:'POST',body:JSON.stringify({name,email,password:pass,setupCode})});
      }else if(err.status===401){
        throw new Error('E-mail ou senha incorretos. Se for o primeiro acesso, informe o código de criação.');
      }else{
        throw err;
      }
    }

    setToken(data.token);
    setUser(data.user);
    await loadRemoteState();
    hideLogin();
    render();
  }catch(e){
    showLoginError(e.message||'Erro ao entrar');
    document.getElementById('lp').value='';
  }finally{
    setLoginLoading(false);
  }
}
function logout(){

/* ─── HELPERS: contas do mês ─── */
function getContasMes(aba,y,m){
  // recorrentes confirmadas para este mês
  const rec=[];
  for(const r of DB.casal.recorrentes){
    const inst=getInst(y,m,r.id,aba);
    if(!inst.confirmed)continue;
    const val=aba==='ele'?r.ele:r.ela;
    // Mês atual: pular contas pendentes cujo dia já passou
    const _hoje=new Date();const _isCurr=(y===TODAY_Y&&m===TODAY_M);
    if(_isCurr&&r.day<_hoje.getDate()&&!inst.pago)continue;
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(r.day).padStart(2,'0')}`;
    rec.push({id:`R_${r.id}`,recId:r.id,emoji:r.emoji,desc:r.desc,val,cat:r.cat,data:dateStr,pago:inst.pago,isRec:true});
  }
  // avulsas deste mês
  const avul=DB[aba].futuras.filter(f=>{
    const d=new Date(f.data+'T12:00');
    return d.getFullYear()===y&&d.getMonth()===m;
  });
  return [...rec,...avul].sort((a,b)=>new Date(a.data)-new Date(b.data));
}

function marcaPago(aba,id,recId,val){
  if(id.startsWith('R_')){
    const inst=getInst(TODAY_Y,TODAY_M,recId,aba);if(inst.pago)return;
    inst.pago=true;
  }else{
    const f=DB[aba].futuras.find(x=>x.id==id);if(!f||f.pago)return;
    f.pago=true;
  }
  DB[aba].saldo-=money(val);
  render();
}
function desfazPago(aba,id,recId,val){
  if(id.startsWith('R_')){
    const inst=getInst(TODAY_Y,TODAY_M,recId,aba);if(!inst.pago)return;
    inst.pago=false;
  }else{
    const f=DB[aba].futuras.find(x=>x.id==id);if(!f||!f.pago)return;
    f.pago=false;
  }
  DB[aba].saldo+=money(val);
  render();
}
function delAvulsa(aba,id){
  if(!confirm('Excluir?'))return;
  const f=DB[aba].futuras.find(x=>x.id==id);
  if(f?.pago)DB[aba].saldo+=money(f.val);
  DB[aba].futuras=DB[aba].futuras.filter(x=>x.id!=id);
  render();
}

function aplicaEspSaldo(i,dir=-1){

  else if(i.quem==='Ele'){DB.ele.saldo+=mult*money(i.val);}
  else if(i.quem==='Ela'){DB.ela.saldo+=mult*money(i.val);}
}

/* Criar futuras avulsas individuais para esporádico programado */
function criaFuturasEspProg(i){
  const dateStr=i.data||todayISO();
  if((i.quem==='Ambos'||i.quem==='Ele')&&i.ele>0){
    DB.ele.futuras.push({id:uid(),emoji:i.emoji,desc:i.desc+' (casal)',val:money(i.ele),cat:i.cat,data:dateStr,pago:false,espId:i.id});
  }
  if((i.quem==='Ambos'||i.quem==='Ela')&&i.ela>0){
    DB.ela.futuras.push({id:uid(),emoji:i.emoji,desc:i.desc+' (casal)',val:money(i.ela),cat:i.cat,data:dateStr,pago:false,espId:i.id});
  }
}

/* Remove futuras avulsas ligadas a um esporádico programado */
function removeFuturasEspProg(espId){
  DB.ele.futuras=DB.ele.futuras.filter(f=>f.espId!==espId);
  DB.ela.futuras=DB.ela.futuras.filter(f=>f.espId!==espId);
}

/* Pagar esporádico programado — desconta saldo de cada um */
function pagarEspProg(id){
  const i=DB.casal.esporadicas.find(x=>x.id===id);
  if(!i||i.tipo!=='programado'||i.pago)return;
  i.pago=true;
  // Desconta saldo de cada um
  if(i.quem==='Ambos'){DB.ele.saldo-=money(i.ele);DB.ela.saldo-=money(i.ela);}
  else if(i.quem==='Ele')DB.ele.saldo-=money(i.val);
  else DB.ela.saldo-=money(i.val);
  // Marca as futuras avulsas como pagas também
  DB.ele.futuras.filter(f=>f.espId===id).forEach(f=>{f.pago=true;});
  DB.ela.futuras.filter(f=>f.espId===id).forEach(f=>{f.pago=true;});
  saveDB();saveCloudDebounced();render();
}

/* Desfazer pagamento de esporádico programado */
function desfazEspProg(id){
  const i=DB.casal.esporadicas.find(x=>x.id===id);
  if(!i||!i.pago)return;
  i.pago=false;
  if(i.quem==='Ambos'){DB.ele.saldo+=money(i.ele);DB.ela.saldo+=money(i.ela);}
  else if(i.quem==='Ele')DB.ele.saldo+=money(i.val);
  else DB.ela.saldo+=money(i.val);
  DB.ele.futuras.filter(f=>f.espId===id).forEach(f=>{f.pago=false;});
  DB.ela.futuras.filter(f=>f.espId===id).forEach(f=>{f.pago=false;});

function metaProgress(i){
  // Retorna {pct, falta, projLabel, projClass, barColor}
  const meta=money(i.meta||0);
  if(meta<=0)return null;
  const atual=money(i.val);
  const pct=Math.min(100,Math.round((atual/meta)*100));
  const falta=Math.max(0,meta-atual);
  if(pct>=100)return{pct:100,falta:0,projLabel:'🎉 Meta atingida!',projClass:'done',barColor:'var(--G)'};
  // Projeção por data
  let projLabel='',projClass='ok';
  if(i.prazo){
    const hoje=new Date();
    const alvo=new Date(i.prazo+'T12:00');
    const diasRestantes=Math.max(1,Math.ceil((alvo-hoje)/(1000*60*60*24)));
    const mesesRestantes=diasRestantes/30;
    const porMes=mesesRestantes>0?falta/mesesRestantes:falta;
    if(hoje>alvo){projLabel='⚠️ Prazo vencido';projClass='warn';}
    else{projLabel=`~${fmt(porMes)}/mês p/ atingir`;projClass=porMes>5000?'warn':'ok';}
  }
  const barColor=pct>=80?'var(--G)':pct>=50?'var(--B)':'var(--O)';
  return{pct,falta,projLabel,projClass,barColor};
}

  // SVG ring
  const r=40,circ=2*Math.PI*r;
  const dash=circ*(health/100);

  m.innerHTML=`

/* ══════════════════════════════════════
   📊 GRÁFICO DE CATEGORIAS
══════════════════════════════════════ */
const CAT_COLORS=[
  '#34c759','#007aff','#ff9500','#ff3b30','#af52de',
  '#5ac8fa','#ff2d55','#ffcc00','#4cd964','#ff6b35',
  '#a8e6cf','#fd79a8','#6c5ce7','#00b894','#e17055'
];

let chartMode='saidas'; // 'saidas' | 'contas' | 'tudo'

function buildCatData(mode, eleSai, elaSai, contsEle, contsEla){
  const map={};
  const add=(cat,val,emoji)=>{
    if(!cat||val<=0)return;
    if(!map[cat])map[cat]={cat,val:0,emoji:emoji||'💰'};
    map[cat].val+=val;
  };

  if(mode==='saidas'||mode==='tudo'){
    eleSai.forEach(i=>add(i.cat,i.val,i.emoji));
    elaSai.forEach(i=>add(i.cat,i.val,i.emoji));
  }
  if(mode==='contas'||mode==='tudo'){
    contsEle.forEach(i=>add(i.cat,i.val,i.emoji));
    contsEla.forEach(i=>add(i.cat,i.val,i.emoji));
  }

  return Object.values(map)
    .filter(d=>d.val>0)
    .sort((a,b)=>b.val-a.val);
}

function buildPieSlices(data){
  const total=data.reduce((s,d)=>s+d.val,0);
  if(total<=0)return[];
  let angle=-Math.PI/2; // começa no topo
  return data.map((d,i)=>{
    const pct=d.val/total;
    const sweep=pct*2*Math.PI;
    const startAngle=angle;
    angle+=sweep;
    return{...d,pct,sweep,startAngle,endAngle:angle,color:CAT_COLORS[i%CAT_COLORS.length]};
  });
}

function polarToXY(cx,cy,r,angle){
  return{x:cx+r*Math.cos(angle),y:cy+r*Math.sin(angle)};
}

function slicePath(cx,cy,r,inner,startAngle,endAngle){
  const large=endAngle-startAngle>Math.PI?1:0;
  const s=polarToXY(cx,cy,r,startAngle);
  const e=polarToXY(cx,cy,r,endAngle);
  const si=polarToXY(cx,cy,inner,startAngle);
  const ei=polarToXY(cx,cy,inner,endAngle);
  return`M${s.x.toFixed(2)},${s.y.toFixed(2)} A${r},${r} 0 ${large},1 ${e.x.toFixed(2)},${e.y.toFixed(2)} L${ei.x.toFixed(2)},${ei.y.toFixed(2)} A${inner},${inner} 0 ${large},0 ${si.x.toFixed(2)},${si.y.toFixed(2)} Z`;
}

function renderCatChart(eleSai, elaSai, contsEle, contsEla){
  const data=buildCatData(chartMode, eleSai, elaSai, contsEle, contsEla);
  const total=data.reduce((s,d)=>s+d.val,0);

  const tabs=`
<div class="chart-tab-wrap">
  <button class="chart-tab${chartMode==='saidas'?' on':''}" onclick="setChartMode('saidas')">💸 Gastos</button>
  <button class="chart-tab${chartMode==='contas'?' on':''}" onclick="setChartMode('contas')">📋 Contas</button>
  <button class="chart-tab${chartMode==='tudo'?' on':''}" onclick="setChartMode('tudo')">Tudo</button>
</div>`;

  if(!data.length) return`<div class="gc"><div class="glbl">Por categoria</div>${tabs}<div class="chart-empty">Sem lançamentos para exibir</div></div>`;

  const slices=buildPieSlices(data);
  const cx=60,cy=60,r=52,inner=28;
  const paths=slices.map((s,i)=>`
<path d="${slicePath(cx,cy,r,inner,s.startAngle,s.endAngle)}"
  fill="${s.color}" opacity=".92"
  style="cursor:pointer;transition:opacity .15s"
  onmouseenter="this.style.opacity=1;this.style.transform='scale(1.03)';this.style.transformOrigin='${cx}px ${cy}px'"
  onmouseleave="this.style.opacity='.92';this.style.transform=''"
/>`).join('');

  const svgHtml=`
<svg class="chart-svg" width="120" height="120" viewBox="0 0 120 120">
  ${paths}
  <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="9" fill="var(--txt3)" font-family="-apple-system,sans-serif">total</text>
  <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--txt)" font-family="-apple-system,sans-serif">${fmt(total).replace('R$ ','R$')}</text>
</svg>`;

  const legendItems=data.slice(0,6).map((d,i)=>{
    const pct=Math.round(d.pct*100);
    const barW=Math.round(d.pct*100);
    return`
<div class="cl-item">
  <div class="cl-dot" style="background:${slices[i].color}"></div>
  <div class="cl-info">
    <div class="cl-name">${d.emoji} ${d.cat}</div>
    <div class="cl-bar-track"><div class="cl-bar-fill" style="width:${barW}%;background:${slices[i].color}"></div></div>
  </div>
  <div><span class="cl-val">${fmt(d.val)}</span><span class="cl-pct">${pct}%</span></div>
</div>`;}).join('');

  const maisHtml=data.length>6?`<div style="font-size:11px;color:var(--txt3);margin-top:4px;padding-left:18px">+${data.length-6} outras categorias</div>`:'';

  return`<div class="gc">
  <div class="glbl">Por categoria</div>
  ${tabs}
  <div class="chart-wrap">
    ${svgHtml}
    <div class="chart-legend">${legendItems}</div>
  </div>
  ${maisHtml}
</div>`;
}

      <div class="loan-meta">${deAvt} ${deNome} emprestou · ${fmtD(e.data)}</div>

        <button class="iab dl" onclick="delEmp(${e.id})" style="width:26px;height:26px;border-radius:6px">✕</button>

</div>`;
}

/* ─── AÇÕES DE EMPRÉSTIMO ─── */
function pagarEmp(id){
  const e=DB.emprestimos.find(x=>x.id===id);
  if(!e||e.pago)return;
  if(!confirm(`Confirmar ${e.tipo==='casal'?'quitação':'devolução'} de ${fmt(e.val)}?`))return;
  e.pago=true;
  e.dataPago=todayISO();
  if(e.tipo==='casal'){
    // dinheiro volta pra quem emprestou e sai de quem recebeu
    DB[e.de].saldo+=money(e.val);
    DB[e.para].saldo-=money(e.val);
  } else {
    // terceiro devolveu: entra no saldo de quem emprestou
    DB[e.de].saldo+=money(e.val);
  }
  saveDB();saveCloudDebounced();render();
}

function estornarEmp(id){
  const e=DB.emprestimos.find(x=>x.id===id);
  if(!e||!e.pago)return;
  if(!confirm('Desfazer a quitação?'))return;
  e.pago=false;e.dataPago=null;
  if(e.tipo==='casal'){
    DB[e.de].saldo-=money(e.val);
    DB[e.para].saldo+=money(e.val);
  } else {
    DB[e.de].saldo-=money(e.val);
  }
  saveDB();saveCloudDebounced();render();
}

function delEmp(id){
  const e=DB.emprestimos.find(x=>x.id===id);
  if(!e)return;
  if(!confirm('Excluir este empréstimo?'))return;
  // Se estava pendente, devolver saldo de quem emprestou
  if(!e.pago){
    if(e.tipo==='ext') DB[e.de].saldo+=money(e.val); // devolve ao que foi descontado
  }
  DB.emprestimos=DB.emprestimos.filter(x=>x.id!==id);
  saveDB();saveCloudDebounced();render();
}

function saveEmp(tipo){
  const isCasal=tipo==='casal';
  const de=document.getElementById('emp-de')?.value||'ele';
  const para=isCasal?(document.getElementById('emp-para')?.value||'ela'):(document.getElementById('emp-para-ext')?.value||'?');
  const val=money(document.getElementById('emp-val')?.value||0);
  const data=document.getElementById('emp-data')?.value||todayISO();
  const obs=document.getElementById('emp-obs')?.value||'';
  const emoji=ST.emoji||(isCasal?'🤝':'🌍');

  if(val<=0){alert('Informe um valor válido.');return;}
  if(!isCasal&&!para.trim()){alert('Informe o nome da pessoa.');return;}
  if(isCasal&&de===para){alert('Quem emprestou e quem recebeu não podem ser a mesma pessoa.');return;}

  const emp={id:uid(),emoji,desc:isCasal?`${de==='ele'?'Ele':'Ela'} → ${para==='ele'?'Ele':'Ela'}`:'Empréstimo ext.',tipo,de,para,val,data,pago:false,dataPago:null,obs};
  DB.emprestimos.push(emp);

  // Debitar de quem emprestou imediatamente
  DB[de].saldo-=val;
  if(isCasal){
    // Creditar em quem recebeu
    DB[para].saldo+=val;
  }

  saveDB();saveCloudDebounced();
  closeModal();render();
}

<div class="r2"><div><label>👨🏻‍🦲 Ele paga</label><input id="m-ele" type="number" placeholder="0,00" oninput="cla('m')"></div><div><label>👩🏻‍🦱 Ela paga</label><input id="m-ela" type="number" placeholder="0,00" oninput="cle('m')"></div></div>

<div class="mnote">🔁 Aparece como template. No próximo mês, você confirma se vai acontecer.</div>`;

    body=`
<div class="esp-tipo-toggle" style="margin-bottom:2px">

function saveModal(tipo,aba){
  const desc=document.getElementById('m-desc')?.value||tipo,emoji=ST.emoji;
  if(tipo==='entrada'){
    const val=parseFloat(document.getElementById('m-val')?.value)||0,cat=document.getElementById('m-cat')?.value||'Outros',data=document.getElementById('m-data')?.value||todayISO();
    DB[aba].entradas.push({id:uid(),emoji,desc,val,cat,data});DB[aba].saldo+=val;
  } else if(tipo==='saida'){
    const val=parseFloat(document.getElementById('m-val')?.value)||0,cat=document.getElementById('m-cat')?.value||'Outros',data=document.getElementById('m-data')?.value||todayISO();
    DB[aba].saidas.push({id:uid(),emoji,desc,val,cat,data});DB[aba].saldo-=val;
  } else if(tipo==='futura_avulsa'){
    const val=parseFloat(document.getElementById('m-val')?.value)||0,cat=document.getElementById('m-cat')?.value||'Outros',venc=document.getElementById('m-venc')?.value||todayISO();
    DB[aba].futuras.push({id:uid(),emoji,desc,val,cat,data:venc,pago:false});
  } else if(tipo==='fixo'){
    const tot=parseFloat(document.getElementById('m-tot')?.value)||0,ele=parseFloat(document.getElementById('m-ele')?.value)||0,ela=parseFloat(document.getElementById('m-ela')?.value)||0,day=parseInt(document.getElementById('m-day')?.value)||25;
    const newId=uid();
    const catFixo=document.getElementById('m-cat-fixo')?.value||'Moradia';
    DB.casal.recorrentes.push({id:newId,emoji,desc,total:tot,ele,ela,cat:catFixo,day});
    // confirma para mês atual só se o dia ainda não passou; próximo mês sempre confirma
    const _todayDay=new Date().getDate();
    const _currOk=day>=_todayDay;
    DB.instancias[`${TODAY_Y}_${TODAY_M}_${newId}_ele`]={confirmed:_currOk,pago:false};
    DB.instancias[`${TODAY_Y}_${TODAY_M}_${newId}_ela`]={confirmed:_currOk,pago:false};
    const _nm=TODAY_M===11?0:TODAY_M+1,_ny=TODAY_M===11?TODAY_Y+1:TODAY_Y;
    DB.instancias[`${_ny}_${_nm}_${newId}_ele`]={confirmed:true,pago:false};
    DB.instancias[`${_ny}_${_nm}_${newId}_ela`]={confirmed:true,pago:false};
  } else if(tipo==='esporadico'){
    const tot=parseFloat(document.getElementById('m-tot')?.value)||0,ele=parseFloat(document.getElementById('m-ele')?.value)||0,ela=parseFloat(document.getElementById('m-ela')?.value)||0,dt=document.getElementById('m-dt')?.value||todayISO();
    const q=document.getElementById('m-quem')?.value||'Ambos',quem=q.includes('ele')?'Ele':q.includes('ela')?'Ela':'Ambos';
    const tipoEsp=document.getElementById('ett-prog')?.classList.contains('on-programado')?'programado':'imediato';
    const catEsp=document.getElementById('m-cat-esp')?.value||'Lazer';
    const item={id:uid(),emoji,desc,val:tot,ele,ela,cat:catEsp,data:dt,quem,tipo:tipoEsp,pago:false};
    DB.casal.esporadicas.push(item);
    if(tipoEsp==='imediato'){
      aplicaEspSaldo(item,-1); // desconta saldo imediatamente
    } else {
      criaFuturasEspProg(item); // cria "a pagar" nos individuais
    }
  } else if(tipo==='nova_res'){
    const rawQuem=document.getElementById('m-quem-res')?.value||'Casal';
    const quem=rawQuem.includes('Ele')?'Ele':rawQuem.includes('Ela')?'Ela':'Casal';
    const val=parseFloat(document.getElementById('m-val-res')?.value)||0;
    const banco=document.getElementById('m-banco-res')?.value||'Sem banco';
    const objetivo=document.getElementById('m-obj-res')?.value||'Sem objetivo';
    const meta=money(document.getElementById('m-meta-res')?.value||0);
    const prazo=document.getElementById('m-prazo-res')?.value||'';
    DB.eco.push({id:uid(),emoji,desc,val,banco,objetivo,quem,meta,prazo});
    // Descontar do saldo de quem guardou o valor inicial
    if(val>0){
      if(quem==='Ele') DB.ele.saldo-=val;
      else if(quem==='Ela') DB.ela.saldo-=val;
      else { DB.ele.saldo-=val/2; DB.ela.saldo-=val/2; } // Casal: divide
    }
  }
  saveDB();saveCloudDebounced();closeModal();render();
}

/* ─── DIV HELPERS ─── */
function cd(p){const t=parseFloat(document.getElementById(p+'-tot')?.value)||0;const el=document.getElementById(p+'-ele'),ela=document.getElementById(p+'-ela');if(el&&ela){el.value=(t/2).toFixed(2);ela.value=(t/2).toFixed(2);}}
function cla(p){const t=parseFloat(document.getElementById(p+'-tot')?.value)||0,e=parseFloat(document.getElementById(p+'-ele')?.value)||0;const ela=document.getElementById(p+'-ela');if(ela)ela.value=Math.max(0,t-e).toFixed(2);}
function cle(p){const t=parseFloat(document.getElementById(p+'-tot')?.value)||0,e=parseFloat(document.getElementById(p+'-ela')?.value)||0;const ele=document.getElementById(p+'-ele');if(ele)ele.value=Math.max(0,t-e).toFixed(2);}
function togDiv(){const q=document.getElementById('m-quem')?.value||'',t=parseFloat(document.getElementById('m-tot')?.value)||0,el=document.getElementById('m-ele'),ela=document.getElementById('m-ela');if(!el||!ela)return;if(q.includes('ele')){el.value=t.toFixed(2);ela.value='0.00';}else if(q.includes('ela')){ela.value=t.toFixed(2);el.value='0.00';}else{el.value=(t/2).toFixed(2);ela.value=(t/2).toFixed(2);}}
function pickE(e,btn){ST.emoji=e;document.querySelectorAll('.epb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');const p=document.getElementById('ep-prev');if(p)p.textContent=e;}

/* ─── IA ─── */
function openIA(){
  const nomes={ele:'👨🏻‍🦲 Ele',ela:'👩🏻‍🦱 Ela',casal:'🏠 Casal',eco:'🐷 Poupança',mes:`📅 ${MNAMES[ST.vm]}`,emp:'🤝 Empréstimos'};
  showModal(`<div class="mh"></div><h3>✦ Assistente FT</h3>
<div class="mnote">Contexto: <strong>${nomes[ST.aba]}</strong></div>
<div class="iachips">${['Como estão meus gastos?','Onde posso economizar?','Resumo do mês','Estou no verde?','Dicas para o próximo mês'].map(c=>`<button class="iachip" onclick="setIaQ('${c}')">${c}</button>`).join('')}</div>
<div class="iair"><input type="text" id="ia-in" placeholder="Pergunte sobre suas finanças…" onkeydown="if(event.key==='Enter')sendIA()"><button class="iasend" onclick="sendIA()">→</button></div>
<div id="ia-out"></div>
<div class="mbtns" style="margin-top:6px"><button class="ab abgr" onclick="closeModal()">Fechar</button></div>`);
}
function setIaQ(q){const i=document.getElementById('ia-in');if(i)i.value=q;}
function buildResumoIA(aba){
  const totalEntradas=DB.ele.entradas.reduce((s,i)=>s+money(i.val),0)+DB.ela.entradas.reduce((s,i)=>s+money(i.val),0);
  const totalSaidas=DB.ele.saidas.reduce((s,i)=>s+money(i.val),0)+DB.ela.saidas.reduce((s,i)=>s+money(i.val),0);
  const contasEle=getContasMes('ele',TODAY_Y,TODAY_M),contasEla=getContasMes('ela',TODAY_Y,TODAY_M);
  const pend=[...contasEle,...contasEla].filter(i=>!i.pago).reduce((s,i)=>s+money(i.val),0);
  const reservas=DB.eco.reduce((s,i)=>s+money(i.val),0);
  const saldo=money(DB.ele.saldo)+money(DB.ela.saldo);
  return {aba,totalEntradas,totalSaidas,pend,reservas,saldo,projecao:saldo-pend};
}
function respostaLocalIA(q,aba){
  const r=buildResumoIA(aba);
  const gastoPct=r.totalEntradas>0?Math.round((r.totalSaidas/r.totalEntradas)*100):0;
  const tom=r.projecao>=0?'no verde':'em atenção';
  return `Resumo rápido: vocês têm ${fmt(r.saldo)} de saldo somado, ${fmt(r.pend)} ainda a pagar neste mês e uma projeção final de ${fmt(r.projecao)}. Pelo cenário atual, o mês está ${tom}.

As saídas realizadas representam cerca de ${gastoPct}% das entradas cadastradas. O ponto de atenção é acompanhar as contas pendentes antes de assumir novos gastos variáveis.

Sugestão prática: antes de gastar, separe primeiro o valor pendente (${fmt(r.pend)}) e mantenha as reservas intocadas. Hoje vocês têm ${fmt(r.reservas)} em poupanças/metas.`;
}
async function sendIA(){
  const inp=document.getElementById('ia-in'),q=inp?.value?.trim();if(!q)return;
  const out=document.getElementById('ia-out');if(out)out.innerHTML='<div class="iaload">✦ Analisando…</div>';
  const a=ST.aba;
  if(API_BASE&&getToken()){
    try{
      const data=await apiFetch('/ai/analyze',{method:'POST',body:JSON.stringify({question:q,context:a,state:DB})});
      if(out)out.innerHTML=`<div class="iaresp">${data.answer||'Sem resposta.'}</div>`;
      return;
    }catch(e){console.warn('Falha no backend de IA, usando análise local.',e);}
  }
  setTimeout(()=>{if(out)out.innerHTML=`<div class="iaresp">${respostaLocalIA(q,a)}</div>`;},250);
}

  if(!getToken())return;
  try{
    await loadRemoteState();
    document.getElementById('ls').style.display='none';
    const ap=document.getElementById('app');ap.style.display='flex';

  }catch(e){
    console.warn('Sessão expirada ou inválida',e);
    setToken('');
    setUser(null);
  }
}
